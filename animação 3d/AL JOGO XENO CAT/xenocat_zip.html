<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Xeno Cat ZIP — Mission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #03060f;
        --bg-card: rgba(8, 10, 16, 0.92);
        --accent: #00b4ff;
        --accent-dim: #0077b6;
        --accent-glow: rgba(0, 180, 255, 0.45);
        --accent-red: #ff2a2a;
        --success: #00ff88;
        --success-glow: rgba(0, 255, 136, 0.4);
        --text: #e8e8e8;
        --text-muted: #9a9a9a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      @keyframes scanline {
        0% {
          transform: translateY(-100%);
        }
        100% {
          transform: translateY(100vh);
        }
      }

      @keyframes pulse-border {
        0%,
        100% {
          box-shadow:
            0 0 8px var(--accent-glow),
            0 0 20px var(--accent-glow);
        }
        50% {
          box-shadow:
            0 0 18px var(--accent-glow),
            0 0 40px rgba(0, 180, 255, 0.25);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      @keyframes bounce {
        0% {
          transform: scale(0.4);
          opacity: 0;
        }
        60% {
          transform: scale(1.12);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes glow-pulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      body {
        font-family: "Merriweather", Georgia, serif;
        background: #03060f;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 10px 20px;
        overflow-x: hidden;
        position: relative;
      }

      /* Scanline animada */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          transparent,
          rgba(0, 180, 255, 0.12),
          transparent
        );
        animation: scanline 5s linear infinite;
        pointer-events: none;
        z-index: 999;
      }

      /* Grid de fundo estilo holográfico */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 180, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 180, 255, 0.025) 1px, transparent 1px);
        background-size: 36px 36px;
        pointer-events: none;
        z-index: 0;
      }

      /* === HEADER HUD === */
      .header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 12px;
        width: 100%;
        max-width: 440px;
        background: var(--bg-card);
        border: 1px solid rgba(0, 180, 255, 0.25);
        border-radius: 16px;
        padding: 12px 16px;
        backdrop-filter: blur(16px);
        position: relative;
        z-index: 1;
      }

      .header::before {
        content: "XENO-CAT ZIP // MISSÃO ATIVA";
        position: absolute;
        top: -8px;
        left: 16px;
        font-size: 0.55rem;
        letter-spacing: 0.18em;
        color: var(--accent);
        background: #03060f;
        padding: 0 6px;
        font-family: monospace;
        animation: glow-pulse 2.5s ease-in-out infinite;
      }

      .logo {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #050f22;
        border: 2px solid var(--accent);
        object-fit: cover;
        box-shadow: 0 0 16px var(--accent-glow);
        animation: pulse-border 3s ease-in-out infinite;
        flex-shrink: 0;
      }

      .title-box h1 {
        font-size: 1.3rem;
        font-weight: 900;
        background: linear-gradient(
          90deg,
          #00b4ff 0%,
          #55ddff 60%,
          #aafff7 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.04em;
      }

      .title-box p {
        font-size: 0.68rem;
        color: var(--text-muted);
        margin-top: 4px;
        letter-spacing: 0.1em;
        font-family: monospace;
        text-transform: uppercase;
      }

      /* === INSTRUÇÕES === */
      .instructions {
        background: var(--bg-card);
        border: 1px solid rgba(0, 180, 255, 0.12);
        border-radius: 12px;
        padding: 9px 14px;
        margin-bottom: 10px;
        width: 100%;
        max-width: 440px;
        display: flex;
        justify-content: space-around;
        font-size: 0.72rem;
        color: var(--text-muted);
        gap: 8px;
        backdrop-filter: blur(8px);
        position: relative;
        z-index: 1;
      }

      .instructions div {
        text-align: center;
        flex: 1;
      }

      .instructions strong {
        color: var(--accent);
        display: block;
        margin-bottom: 2px;
        font-family: monospace;
        letter-spacing: 0.06em;
      }

      /* === SELETOR DE NÍVEL === */
      .level-selector {
        display: flex;
        gap: 5px;
        margin-bottom: 10px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 440px;
        position: relative;
        z-index: 1;
      }

      .lvl-dot {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        background: rgba(4, 10, 28, 0.85);
        border: 1px solid rgba(0, 180, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.68rem;
        font-weight: 700;
        cursor: pointer;
        color: var(--text-muted);
        transition: all 0.15s;
        flex-shrink: 0;
        font-family: monospace;
      }

      .lvl-dot.active {
        background: rgba(0, 100, 200, 0.35);
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 10px rgba(0, 180, 255, 0.4);
      }

      .lvl-dot:hover:not(.active) {
        border-color: rgba(0, 180, 255, 0.35);
        color: var(--text);
      }

      /* === GRID === */
      .grid-container {
        background: var(--bg-card);
        border-radius: 18px;
        padding: 10px;
        border: 1px solid rgba(0, 180, 255, 0.2);
        box-shadow:
          0 0 50px rgba(0, 180, 255, 0.07),
          0 16px 60px rgba(0, 0, 0, 0.75),
          inset 0 0 30px rgba(0, 180, 255, 0.03);
        position: relative;
        z-index: 1;
      }

      #grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
        width: min(92vw, 370px);
        aspect-ratio: 1;
      }

      .cell {
        background: rgba(6, 14, 34, 0.85);
        border: 1px solid rgba(0, 180, 255, 0.08);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.95rem;
        color: rgba(150, 180, 210, 0.5);
        position: relative;
        transition:
          background 0.1s,
          transform 0.1s,
          box-shadow 0.1s;
        touch-action: none;
        font-family: monospace;
      }

      .cell.number {
        background: rgba(0, 30, 65, 0.95);
        border: 1px solid var(--accent);
        color: var(--accent);
        box-shadow:
          0 0 8px rgba(0, 180, 255, 0.25),
          inset 0 0 8px rgba(0, 180, 255, 0.06);
        font-size: 1.05rem;
      }

      .cell.start {
        background: rgba(0, 50, 30, 0.95);
        border: 1px solid var(--success);
        color: var(--success);
        box-shadow: 0 0 12px var(--success-glow);
      }

      .cell.path {
        background: rgba(0, 100, 190, 0.22);
        border-color: rgba(0, 180, 255, 0.35);
        color: rgba(0, 210, 255, 0.8);
      }

      .cell.current {
        background: rgba(0, 180, 255, 0.28);
        border-color: var(--accent);
        transform: scale(1.07);
        box-shadow:
          0 0 16px var(--accent-glow),
          inset 0 0 10px rgba(0, 180, 255, 0.12);
        color: #fff;
      }

      .cell.wrong {
        background: rgba(255, 42, 42, 0.28) !important;
        border-color: var(--accent-red) !important;
        box-shadow: 0 0 14px rgba(255, 42, 42, 0.5) !important;
        animation: shake 0.3s;
      }

      /* === CONTROLES === */
      .controls {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        width: 100%;
        max-width: 440px;
        justify-content: center;
        position: relative;
        z-index: 1;
      }

      button {
        flex: 1;
        max-width: 140px;
        padding: 10px 8px;
        border-radius: 10px;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.2s,
          border-color 0.2s;
        font-family: monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      button:active {
        transform: scale(0.93);
      }

      #btn-undo {
        background: rgba(4, 10, 28, 0.9);
        color: var(--text-muted);
        border: 1px solid rgba(0, 180, 255, 0.15);
      }

      #btn-undo:hover {
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 10px rgba(0, 180, 255, 0.2);
      }

      #btn-reset {
        background: rgba(4, 10, 28, 0.9);
        color: var(--text-muted);
        border: 1px solid rgba(255, 42, 42, 0.2);
      }

      #btn-reset:hover {
        border-color: var(--accent-red);
        color: var(--accent-red);
        box-shadow: 0 0 10px rgba(255, 42, 42, 0.25);
      }

      #btn-hint {
        background: linear-gradient(
          135deg,
          rgba(0, 70, 140, 0.9),
          rgba(0, 40, 100, 0.9)
        );
        color: var(--accent);
        border: 1px solid var(--accent);
        box-shadow: 0 0 10px rgba(0, 180, 255, 0.2);
      }

      #btn-hint:hover {
        box-shadow: 0 0 18px var(--accent-glow);
      }

      /* === STATUS HUD === */
      .status {
        margin-top: 10px;
        min-height: 26px;
        font-size: 0.78rem;
        font-weight: 700;
        text-align: center;
        color: var(--accent);
        font-family: monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
      }

      .level-info {
        font-size: 0.65rem;
        color: var(--text-muted);
        margin-top: 5px;
        text-align: center;
        font-family: monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
      }

      /* === WIN OVERLAY === */
      .win-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2, 5, 16, 0.94);
        backdrop-filter: blur(14px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
      }

      .win-overlay.show {
        display: flex;
      }

      .win-overlay img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 3px solid var(--accent);
        margin-bottom: 18px;
        animation: bounce 0.6s ease;
        box-shadow:
          0 0 30px var(--accent-glow),
          0 0 60px rgba(0, 180, 255, 0.15);
      }

      .win-overlay h2 {
        font-size: 1.5rem;
        background: linear-gradient(90deg, #00b4ff, #00ffcc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
        letter-spacing: 0.06em;
        text-align: center;
      }

      .win-overlay p {
        color: var(--text-muted);
        margin-bottom: 22px;
        text-align: center;
        font-size: 0.88rem;
        line-height: 1.7;
      }

      .win-overlay-btns {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .win-overlay button {
        padding: 12px 26px;
        max-width: none;
        width: auto;
        flex: none;
      }

      .win-overlay #btn-reset {
        background: rgba(4, 10, 28, 0.9);
        color: var(--text-muted);
        border: 1px solid rgba(0, 180, 255, 0.2);
      }

      #btn-next-level {
        background: linear-gradient(
          135deg,
          rgba(0, 180, 255, 0.18),
          rgba(0, 80, 160, 0.3)
        );
        color: var(--accent);
        border: 1px solid var(--accent);
        box-shadow: 0 0 16px var(--accent-glow);
        max-width: 220px;
      }
    </style>
  </head>

        {

      ];

      let currentLevel = 0;
      let SIZE = LEVELS[0].size;
      let NUMBERS = LEVELS[0].numbers;

      // ===== ESTADO DO JOGO =====
      let path = [];
      let visited = new Set();
      let isDrawing = false;
      let gameWon = false;

      const gridEl = document.getElementById("grid");
      const statusEl = document.getElementById("status");
      const winOverlay = document.getElementById("winOverlay");
      const levelInfoEl = document.querySelector(".level-info");

      // ===== CARREGAR NÍVEL =====
      function loadLevel(idx) {
        currentLevel = idx;
        const lvl = LEVELS[idx];
        SIZE = lvl.size;
        NUMBERS = lvl.numbers;
        path = [];
        visited.clear();
        isDrawing = false;
        gameWon = false;
        winOverlay.classList.remove("show");
        levelInfoEl.textContent = lvl.name;

        const nextBtn = document.getElementById("btn-next-level");
        if (nextBtn) {
          if (currentLevel < LEVELS.length - 1) {
            nextBtn.textContent = "Próximo Nível →";
            nextBtn.disabled = false;
            nextBtn.style.opacity = "1";
          } else {
            nextBtn.textContent = "🏆 Concluído!";
            nextBtn.disabled = true;
            nextBtn.style.opacity = "0.5";
          }
        }
        updateLevelDots();
        createGrid();
        statusEl.textContent = "Toque no 1 para começar";
      }

      function updateLevelDots() {
        document.querySelectorAll(".lvl-dot").forEach((d, i) => {
          d.classList.toggle("active", i === currentLevel);
        });
      }

      function nextLevel() {
        if (currentLevel < LEVELS.length - 1) {
          loadLevel(currentLevel + 1);
        }
      }

      // ===== CRIAR GRADE =====
      function createGrid() {
        gridEl.innerHTML = "";
        gridEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.r = r;
            cell.dataset.c = c;
            const key = `${r},${c}`;
            if (NUMBERS[key]) {
              cell.textContent = NUMBERS[key];
              cell.classList.add("number");
              if (NUMBERS[key] === 1) cell.classList.add("start");
            }
            cell.addEventListener("pointerdown", onPointerDown);
            cell.addEventListener("pointerenter", onPointerEnter);
            gridEl.appendChild(cell);
          }
        }
      }

      // ===== LÓGICA DE DESENHO =====
      function onPointerDown(e) {
        if (gameWon) return;
        e.preventDefault();
        const cell = e.currentTarget;
        const key = `${cell.dataset.r},${cell.dataset.c}`;

        if (path.length === 0) {
          if (NUMBERS[key] !== 1) {
            statusEl.textContent = "Comece pelo número 1!";
            return;
          }
          addToPath(key);
          isDrawing = true;
          cell.setPointerCapture(e.pointerId);
          return;
        }

        if (key === path[path.length - 1]) {
          isDrawing = true;
          cell.setPointerCapture(e.pointerId);
        }
      }

      function onPointerEnter(e) {
        if (!isDrawing || gameWon) return;
        const cell = e.currentTarget;
        const key = `${cell.dataset.r},${cell.dataset.c}`;
        tryAddCell(key);
      }

      document.addEventListener("pointermove", (e) => {
        if (!isDrawing || gameWon) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        if (el && el.classList.contains("cell")) {
          const key = `${el.dataset.r},${el.dataset.c}`;
          tryAddCell(key);
        }
      });

      document.addEventListener("pointerup", () => {
        isDrawing = false;
        checkWin();
      });

      document.addEventListener("pointercancel", () => {
        isDrawing = false;
      });

      function tryAddCell(key) {
        if (visited.has(key)) {
          if (path.length >= 2 && path[path.length - 2] === key) {
            undoLast();
          }
          return;
        }

        const lastKey = path[path.length - 1];
        if (!isAdjacent(lastKey, key)) return;

        if (NUMBERS[key]) {
          const expected = path.filter((k) => NUMBERS[k]).length + 1;
          if (NUMBERS[key] !== expected) {
            flashWrong(key);
            statusEl.textContent = `Ordem errada! Próximo é o ${expected}`;
            return;
          }
        }

        addToPath(key);
      }

      function addToPath(key) {
        path.push(key);
        visited.add(key);
        updateCells();
        statusEl.textContent = `Caminho: ${path.length} / ${SIZE * SIZE}`;
      }

      function isAdjacent(key1, key2) {
        const [r1, c1] = key1.split(",").map(Number);
        const [r2, c2] = key2.split(",").map(Number);
        return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
      }

      function updateCells() {
        document.querySelectorAll(".cell").forEach((cell) => {
          const key = `${cell.dataset.r},${cell.dataset.c}`;
          cell.classList.remove("path", "current");
          if (visited.has(key)) cell.classList.add("path");
          if (path.length && key === path[path.length - 1])
            cell.classList.add("current");
        });
      }

      function flashWrong(key) {
        const [r, c] = key.split(",");
        const cell = document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
        if (cell) {
          cell.classList.add("wrong");
          setTimeout(() => cell.classList.remove("wrong"), 400);
        }
      }

      // ===== CONTROLES =====
      function undoLast() {
        if (path.length <= 1 || gameWon) return;
        const last = path.pop();
        visited.delete(last);
        updateCells();
        statusEl.textContent = `Caminho: ${path.length} / ${SIZE * SIZE}`;
      }

      function resetGame() {
        loadLevel(currentLevel);
      }

      function checkWin() {
        if (path.length !== SIZE * SIZE) return;
        let expected = 1;
        for (const key of path) {
          if (NUMBERS[key]) {
            if (NUMBERS[key] !== expected) return;
            expected++;
          }
        }
        gameWon = true;
        statusEl.textContent = "Caminho completo! 🎉";
        setTimeout(() => winOverlay.classList.add("show"), 300);
      }

      function showHint() {
        if (gameWon || path.length === 0) {
          statusEl.textContent = "Comece pelo 1!";
          return;
        }
        statusEl.textContent =
          "Dica: preencha tudo respeitando a ordem dos números.";
      }

      // ===== EVENTOS DOS BOTÕES =====
      document.getElementById("btn-undo").addEventListener("click", undoLast);
      document.getElementById("btn-reset").addEventListener("click", resetGame);
      document.getElementById("btn-hint").addEventListener("click", showHint);

      // ===== INICIAR =====
      loadLevel(0);
    </script>

    <script>
      let visited = new Set();
      let isDrawing = false;
      let gameWon = false;

      const gridEl = document.getElementById("grid");
      const statusEl = document.getElementById("status");
      const winOverlay = document.getElementById("winOverlay");

      // ===== CRIAR GRADE =====
      function createGrid() {
        gridEl.innerHTML = "";
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.r = r;
            cell.dataset.c = c;
            const key = `${r},${c}`;
            if (NUMBERS[key]) {
              cell.textContent = NUMBERS[key];
              cell.classList.add("number");
              if (NUMBERS[key] === 1) cell.classList.add("start");
            }
            // Eventos de toque / mouse
            cell.addEventListener("pointerdown", onPointerDown);
            cell.addEventListener("pointerenter", onPointerEnter);
            gridEl.appendChild(cell);
          }
        }
      }

      // ===== LÓGICA DE DESENHO =====
      function onPointerDown(e) {
        if (gameWon) return;
        e.preventDefault();
        const cell = e.currentTarget;
        const key = `${cell.dataset.r},${cell.dataset.c}`;

        // Só começa no 1 se path vazio
        if (path.length === 0) {
          if (NUMBERS[key] !== 1) {
            statusEl.textContent = "Comece pelo número 1!";
            return;
          }
          addToPath(key);
          isDrawing = true;
          cell.setPointerCapture(e.pointerId);
          return;
        }

        // Se já tem caminho, só continua se for a última célula
        if (key === path[path.length - 1]) {
          isDrawing = true;
          cell.setPointerCapture(e.pointerId);
        }
      }

      function onPointerEnter(e) {
        if (!isDrawing || gameWon) return;
        const cell = e.currentTarget;
        const key = `${cell.dataset.r},${cell.dataset.c}`;
        tryAddCell(key);
      }

      // Também escuta movimento global para mobile
      document.addEventListener("pointermove", (e) => {
        if (!isDrawing || gameWon) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        if (el && el.classList.contains("cell")) {
          const key = `${el.dataset.r},${el.dataset.c}`;
          tryAddCell(key);
        }
      });

      document.addEventListener("pointerup", () => {
        isDrawing = false;
        checkWin();
      });

      document.addEventListener("pointercancel", () => {
        isDrawing = false;
      });

      function tryAddCell(key) {
        if (visited.has(key)) {
          // Se voltar para a célula anterior, desfaz (opcional, estilo borracha)
          if (path.length >= 2 && path[path.length - 2] === key) {
            undoLast();
          }
          return;
        }

        const lastKey = path[path.length - 1];
        if (!isAdjacent(lastKey, key)) return;

        // Se a célula tem número, tem que ser o próximo
        if (NUMBERS[key]) {
          const expected = path.filter((k) => NUMBERS[k]).length + 1;
          if (NUMBERS[key] !== expected) {
            flashWrong(key);
            statusEl.textContent = `Ordem errada! Próximo é o ${expected}`;
            return;
          }
        }

        addToPath(key);
      }

      function addToPath(key) {
        path.push(key);
        visited.add(key);
        updateCells();
        statusEl.textContent = `Caminho: ${path.length} / 36`;
      }

      function isAdjacent(key1, key2) {
        const [r1, c1] = key1.split(",").map(Number);
        const [r2, c2] = key2.split(",").map(Number);
        return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
      }

      function updateCells() {
        document.querySelectorAll(".cell").forEach((cell) => {
          const key = `${cell.dataset.r},${cell.dataset.c}`;
          cell.classList.remove("path", "current");
          if (visited.has(key)) {
            cell.classList.add("path");
          }
          if (path.length && key === path[path.length - 1]) {
            cell.classList.add("current");
          }
        });
      }

      function flashWrong(key) {
        const cell = document.querySelector(
          `[data-r="${key.split(",")[0]}"][data-c="${key.split(",")[1]}"]`,
        );
        if (cell) {
          cell.classList.add("wrong");
          setTimeout(() => cell.classList.remove("wrong"), 400);
        }
      }

      // ===== CONTROLES =====
      function undoLast() {
        if (path.length <= 1 || gameWon) return;
        const last = path.pop();
        visited.delete(last);
        updateCells();
        statusEl.textContent = `Caminho: ${path.length} / 36`;
      }

      function resetGame() {
        path = [];
        visited.clear();
        isDrawing = false;
        gameWon = false;
        winOverlay.classList.remove("show");
        createGrid();
        statusEl.textContent = "Toque no 1 para começar";
      }

      function checkWin() {
        if (path.length !== SIZE * SIZE) return;

        // Verificar se todos os números apareceram na ordem correta
        let expected = 1;
        for (const key of path) {
          if (NUMBERS[key]) {
            if (NUMBERS[key] !== expected) return;
            expected++;
          }
        }

        // Sucesso!
        gameWon = true;
        statusEl.textContent = "Caminho completo!";
        setTimeout(() => {
          winOverlay.classList.add("show");
        }, 300);
      }

      // Dica simples: mostra o próximo passo possível (bem básica)
      function showHint() {
        if (gameWon || path.length === 0) {
          statusEl.textContent = "Comece pelo 1!";
          return;
        }
        statusEl.textContent =
          "Dica: continue preenchendo sem pular casas e respeitando a ordem dos números.";
      }

      // ===== EVENTOS DOS BOTÕES =====
      document.getElementById("btn-undo").addEventListener("click", undoLast);
      document.getElementById("btn-reset").addEventListener("click", resetGame);
      document.getElementById("btn-hint").addEventListener("click", showHint);

      // Iniciar
      createGrid();
    </script>
  </body>
